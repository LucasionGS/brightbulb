name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Not needed to lint and test; the package job downloads it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

  package:
    name: Packaging (make install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The path the AUR PKGBUILD takes: build app.asar, then install it with
      # its launcher, desktop file, icon and licence into a staging root.
      - name: Build
        run: make build

      - name: make install into a staging root
        run: make install DESTDIR="$PWD/stage" PREFIX=/usr ELECTRON=electron43

      - name: Verify the installed tree
        run: |
          set -eux
          test -x stage/usr/bin/brightbulb
          grep -q 'exec electron43 /usr/lib/brightbulb/app.asar' stage/usr/bin/brightbulb
          test -f stage/usr/share/applications/io.github.brightbulb.BrightBulb.desktop
          test -f stage/usr/share/icons/hicolor/scalable/apps/io.github.brightbulb.BrightBulb.svg
          test -f stage/usr/share/licenses/brightbulb/LICENSE
          npx --yes @electron/asar list stage/usr/lib/brightbulb/app.asar > asar.txt
          for f in main.cjs syncWorker.cjs preload.cjs capturePreload.cjs; do grep -q "/.vite/build/$f" asar.txt; done
          grep -q "/.vite/renderer/main_window/index.html" asar.txt
          grep -q "/.vite/renderer/capture_window/index.html" asar.txt

  pkgbuild:
    name: PKGBUILD sanity
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      - name: Check the PKGBUILD parses and produces .SRCINFO
        run: |
          set -eux
          pacman -Sy --noconfirm --needed git
          # makepkg refuses to run as root, so do this as a normal user.
          useradd -m builder
          chown -R builder .
          su builder -c "cd packaging/aur && makepkg --printsrcinfo > /dev/null"
          bash -n packaging/aur/aur-publish.sh
