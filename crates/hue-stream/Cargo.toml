[package]
name = "brightbulb-dtls"
version = "0.1.0"
edition = "2021"
description = "DTLS-PSK transport for the Philips Hue Entertainment streaming API"
license = "GPL-3.0-or-later"

[lib]
name = "brightbulb_dtls"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312 builds one wheel that works on 3.12+, including 3.14.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
# Links against the system OpenSSL (3.6.x here), which provides
# PSK-AES128-GCM-SHA256 -- the only cipher suite the Hue bridge accepts.
openssl = "0.10"

[profile.release]
opt-level = 3
lto = true
