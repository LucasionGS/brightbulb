[project]
name = "brightbulb-dtls"
version = "0.1.0"
description = "DTLS-PSK transport for the Philips Hue Entertainment streaming API"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "brightbulb_dtls"
features = ["pyo3/extension-module"]
